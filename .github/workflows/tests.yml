name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run Crew app tests
        run: |
          python crew/tests/test_expedient_parity.py
          python crew/tests/test_security_hardening.py
          python crew/tests/test_discovery_sources.py

  gui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node node_modules/vitest/vitest.mjs run --maxWorkers=1
      - run: npm audit --audit-level=moderate
